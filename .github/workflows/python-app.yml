name: Enhanced App Wake-Up

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    container:
      image: selenium/node-chrome:124.0
      volumes:
        - /dev/shm:/dev/shm

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          sudo apt-get install -y libgbm1 xvfb
          pip install selenium webdriver-manager requests==2.32.0

      - name: Run wake-up system
        run: python streamlit_wakeup_enhanced.py
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}  # For private repos

      - name: Upload logs
        uses: actions/upload-artifact@v3
        with:
          name: wakeup-logs
          path: |
            wakeup_log.txt
