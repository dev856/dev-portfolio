name: Enhanced App Wake-Up

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          sudo apt-get install -y libgbm1 xvfb
          pip install selenium webdriver-manager requests==2.32.0

      - name: Run wake-up system
        run: python wake_up_streamlit.py
        

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: wakeup-logs
          path: |
            wakeup_log.txt
